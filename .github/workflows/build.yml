name: Build Dragon Ascension

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Gradle 6.9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.9.1'

      - name: Extrair projeto
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$ZIP"
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          BUILD_FILE=$(find extracted -name build.gradle -print -quit)
          test -n "$BUILD_FILE"
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Preparar e compilar
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon setupDecompWorkspace --stacktrace
          gradle --no-daemon clean build --stacktrace

      - name: Salvar JAR
        uses: actions/upload-artifact@v4
        with:
          name: DragonAscension-JAR
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
